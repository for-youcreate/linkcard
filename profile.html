<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cloud">

  <div class="card" id="profileCard">
    <h2 id="name"></h2>
    <img id="image" style="width:150px; border-radius:10px;">
    <p id="bio"></p>
    <a id="twitter" target="_blank">Twitter</a>
  </div>

  <script>
    async function loadProfile() {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get("uid");

      const url = `https://raw.githubusercontent.com/for-youcreate/linkcard/main/profiles/${uid}.json`;

      const res = await fetch(url);
      const data = await res.json();

      document.getElementById("name").textContent = data.name;
      document.getElementById("bio").textContent = data.bio;
      document.getElementById("image").src = data.imageUrl;
      document.getElementById("twitter").href = `https://twitter.com/${data.twitter}`;
    }

    loadProfile();
  </script>

</body>
</html>
