<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プロフィール作成</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cloud">

  <div class="card">
    <h2>プロフィール作成</h2>

    <label>名前</label>
    <input id="name" type="text" class="input">

    <label>ひとこと</label>
    <input id="bio" type="text" class="input">

    <label>X（Twitter）</label>
    <input id="twitter" type="text" class="input">

    <label>画像アップロード</label>
    <input id="imageInput" type="file" accept="image/*" class="input">

    <button id="saveBtn" class="btn-main">保存する</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
